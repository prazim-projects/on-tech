<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CTF Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/simpledotcss/2.3.7/simple-v1.css">
</head>
<body>
    <nav class="navbar " style="justify-content: space-between; display: flex; align-items: center;" >
        {% for bar in nav %}
            <a href="{% url bar.1 %}" class="nav-item">{{ bar.0 }}</a>
        {% endfor %}
        {% if user.is_authenticated %}
            {% include "registration/_logout.html" %}
        {% endif %}
    </nav>
<hr>

    <main>
        {% block content %}
        {% endblock content %}
    </main>

    <footer>
        <p>&copy; {{ now|date:"Y" }} Fan0s — All Rights Reserved</p>
    </footer>
</body>
</html>
